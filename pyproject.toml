[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wedding-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "duckdb", "pydantic", "pyyaml", "sentence-transformers", "faiss-cpu",
                "rank-bm25", "google-genai", "mcp", "langchain-mcp-adapters"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]